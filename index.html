<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEI TeamArt Student Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrapper">

    <div id="gate">
        <div class="gate-title">FEI TeamArt Portal</div>
        <p style="margin-bottom:20px; color:#666;">Enter your Name or ID Code:</p>
        <form id="codeForm">
            <input type="text" id="codeInput" class="input" placeholder="e.g. Regina">
            <br>
            <button type="submit" class="game-btn">View Report</button>
        </form>
        <div class="gate-note">Try: Regina (She has full data)</div>
    </div>

    <div id="gameUI" style="display:none;">
        
        <div class="header main-header">
            <h1 id="welcomeText">Welcome!</h1>
            
            <div class="progress-container">
                <div class="progress-label">
                    <span id="progressCount">0 / 0 Artifacts</span>
                    <span id="progressPct">0%</span>
                </div>
                <div class="progress-rail">
                    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="card teacher-card">
            <div class="section-title">📝 Teacher's Note</div>
            <div class="teacher-text" id="teacherNote">
                Loading teacher feedback...
            </div>
            <div class="tag-container" id="strengthTags">
                </div>
        </div>

        <div class="card">
            <div class="section-title">🎨 Masterpiece Spotlight</div>
            <p style="font-size:14px; color:#666; margin-bottom:15px;">Selected highlights from this term.</p>
            <div class="spotlight-grid" id="spotlightGrid">
                </div>
        </div>

        <div class="card">
            <div class="section-title">🗺️ Your Adventure Map</div>
            <div class="map-legend">
                <span class="legend-item"><span class="dot earned"></span> Achieved</span>
                <span class="legend-item"><span class="dot next"></span> Recommended Next</span>
                <span class="legend-item"><span class="dot locked"></span> Future Goal</span>
            </div>
            
            <div class="badge-grid" id="badgeGrid">
                </div>
        </div>

        <div class="footer">
            <p>© 2025 FEI TeamArt</p>
        </div>

    </div>
</div>

<script src="app.js"></script>

</body>
</html>
